<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Mini — 3D Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; color: #dfe5ee;
    background: rgba(10, 12, 16, 0.72); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; line-height: 1.7;
    max-width: 360px; z-index: 10; white-space: pre;
    border: 1px solid rgba(255,255,255,0.08);
  }
  #err {
    position: fixed; bottom: 14px; left: 12px; right: 12px; color: #ff8a8a;
    background: rgba(70, 0, 0, 0.7); padding: 10px 14px;
    border-radius: 8px; font-size: 12px; display: none; z-index: 10; white-space: pre-wrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/",
    "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.13.1/src/URDFLoader.js"
  }
}
</script>
</head>
<body>
<div id="hud">กำลังโหลดโมเดล...</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import URDFLoader from 'urdf-loader';

const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
function showErr(msg) {
  errBox.textContent = msg;
  errBox.style.display = 'block';
}

// --- scene / camera / renderer ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.005, 10);
camera.position.set(0.35, 0.28, 0.35);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.08, 0);
controls.update();

// --- แสง + พื้นอ้างอิง ---
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
dirLight.position.set(0.5, 1.0, 0.7);
scene.add(dirLight);
scene.add(new THREE.GridHelper(1, 20, 0x3a3f4a, 0x252a33));

// --- URDF loader (package://assets -> route serve STL) ---
const loader = new URDFLoader();
// หมายเหตุ: อย่าใส่ "/" ลงท้าย — urdf-loader จะเติม "/" ให้เองตอนต่อชื่อไฟล์
loader.packages = { assets: '/api/kinematics/assets' };

let robot = null;

async function loadRobot() {
  const res = await fetch('/api/kinematics/urdf');
  if (!res.ok) throw new Error('/api/kinematics/urdf -> ' + res.status);
  const data = await res.json();
  robot = loader.parse(data.urdf);
  // URDF เป็น Z-up, three.js เป็น Y-up -> หมุนโมเดลให้ตั้งตรง
  robot.rotation.x = -Math.PI / 2;
  scene.add(robot);
  window.__robot = robot;  // สำหรับ debug ตรวจ joint values
  window.__THREE = THREE;   // สำหรับ debug ตรวจ world position
  hud.textContent = 'โมเดลโหลดแล้ว ✓\nรอข้อมูล state...';
}

function setJoint(name, value) {
  if (!robot || !robot.joints || !(name in robot.joints)) return;
  robot.joints[name].setJointValue(value);
}

async function pollState() {
  try {
    const res = await fetch('/api/state/full?with_head_joints=true&with_passive_joints=true');
    if (!res.ok) return;
    const s = await res.json();

    if (robot) {
      // head_joints = [body_yaw, stewart_1 .. stewart_6] (7 ค่า)
      if (Array.isArray(s.head_joints) && s.head_joints.length >= 7) {
        for (let i = 0; i < 6; i++) setJoint('stewart_' + (i + 1), s.head_joints[i + 1]);
      }
      if (typeof s.body_yaw === 'number') setJoint('yaw_body', s.body_yaw);
      if (Array.isArray(s.antennas_position) && s.antennas_position.length >= 2) {
        setJoint('left_antenna', s.antennas_position[0]);
        setJoint('right_antenna', s.antennas_position[1]);
      }
      // passive joints (ก้าน rod) = 21 ค่า: passive_1_x/y/z .. passive_7_x/y/z
      if (Array.isArray(s.passive_joints) && s.passive_joints.length >= 21) {
        for (let i = 1; i <= 7; i++) {
          const b = (i - 1) * 3;
          setJoint('passive_' + i + '_x', s.passive_joints[b]);
          setJoint('passive_' + i + '_y', s.passive_joints[b + 1]);
          setJoint('passive_' + i + '_z', s.passive_joints[b + 2]);
        }
      }
    }

    const hj = Array.isArray(s.head_joints) ? s.head_joints.map(v => v.toFixed(2)).join(', ') : '-';
    const ap = Array.isArray(s.antennas_position) ? s.antennas_position.map(v => v.toFixed(2)).join(', ') : '-';
    hud.textContent =
      'head_joints: ' + hj + '\n' +
      'body_yaw: ' + (typeof s.body_yaw === 'number' ? s.body_yaw.toFixed(2) : '-') + ' rad\n' +
      'antennas (L,R): ' + ap;
  } catch (e) {
    // daemon ยังไม่ตอบ — ข้ามไว้ (เดี๋ยวลองใหม่รอบถัดไป)
  }
}

loadRobot().catch(e => {
  showErr('โหลด URDF ไม่ได้: ' + e.message +
    '\n\nตรวจว่า daemon รันอยู่:  reachy-mini-daemon.exe --sts3215 --no-media');
});

setInterval(pollState, 150);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
